# Prometheus asks each Signal process for its numbers every 15 seconds and keeps them for 15 days.
global:
  scrape_interval: 15s
  evaluation_interval: 15s   # how often the alert rules below are checked

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]          # GET /metrics on the API itself
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]       # the worker's small metrics server (METRICS_PORT)
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9100"]
