# Operational alerts: is Signal itself healthy? (The business alarms are separate: ADR 0008.)
# They show on the Prometheus "Alerts" page. Sending them to people needs Alertmanager (not set up yet).
groups:
  - name: signal
    rules:
      - alert: SignalProcessDown
        expr: up == 0
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.job }} has not answered Prometheus for 1 minute"

      - alert: SignalApiErrors
        # Share of answers that are 5xx (our fault), over the last 5 minutes.
        expr: |
          sum(rate(signal_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(signal_http_requests_total[5m])) > 0.05
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "More than 5% of API requests fail with 5xx (usually Kafka or PostgreSQL is down)"

      - alert: SignalApiSlow
        # 99 of 100 requests should be answered within half a second.
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(signal_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "API p99 latency above 500 ms for 10 minutes"

      - alert: SignalWorkerBehind
        # Messages waiting in Kafka. A burst is fine; still high after 10 minutes is not.
        expr: sum(signal_worker_lag_messages) > 5000
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $value }} messages waiting in Kafka for 10 minutes: add workers or check the database"

      - alert: SignalWorkerRetrying
        # Retries mean the database is failing; the worker is stuck on the same message.
        expr: sum(rate(signal_worker_messages_total{result="retry"}[5m])) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "The worker keeps retrying: PostgreSQL is probably unreachable"

      - alert: SignalUnreadableMessages
        # These are skipped and lost until the dead-letter topic exists.
        expr: increase(signal_worker_messages_total{result="skipped"}[15m]) > 0
        labels: {severity: ticket}
        annotations:
          summary: "{{ $value }} unreadable messages skipped in the last 15 minutes"

      - alert: SignalThemesStale
        # The scheduler recomputes every 5 minutes; 15 minutes without success means it is failing.
        expr: time() - signal_scheduler_last_success_timestamp_seconds{task="themes"} > 900
        labels: {severity: ticket}
        annotations:
          summary: "Themes have not been recomputed successfully for 15 minutes"
