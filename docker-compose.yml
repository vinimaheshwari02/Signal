# Local stack: Redpanda (Kafka API), PostgreSQL, API, worker.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M
      --node-id 0 --check=false
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      POSTGRES_DB: signal
    ports: ["5432:5432"]
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal"]
      interval: 5s
      retries: 20

  api:
    build: .
    command: uvicorn signal_app.entrypoints.api:app --host 0.0.0.0 --port 8000
    environment: &env
      KAFKA_BOOTSTRAP: redpanda:9092
      # API uses the restricted role (row-level security applies)
      DATABASE_URL: postgresql://signal_api:signal_api@postgres:5432/signal
      WORKER_DATABASE_URL: postgresql://signal:signal@postgres:5432/signal
    ports: ["8000:8000"]
    depends_on:
      redpanda: {condition: service_healthy}
      postgres: {condition: service_healthy}

  worker:
    build: .
    command: python -m signal_app.entrypoints.worker
    environment: *env
    depends_on:
      redpanda: {condition: service_healthy}
      postgres: {condition: service_healthy}

volumes:
  pgdata:
