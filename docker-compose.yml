# Local stack: Redpanda (Kafka API), PostgreSQL, API, worker, scheduler.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M
      --node-id 0 --check=false
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20

  # Creates the feedback.raw topic, then exits. Running it again is harmless.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    entrypoint: ["/bin/sh", "-c"]
    command:
      - rpk topic create feedback.raw --partitions 3 -X brokers=redpanda:9092
        || rpk topic describe feedback.raw -X brokers=redpanda:9092
    depends_on:
      redpanda: {condition: service_healthy}

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      POSTGRES_DB: signal
    ports: ["5432:5432"]
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal"]
      interval: 5s
      retries: 20

  api:
    build: .
    command: uvicorn signal_app.entrypoints.api:app --host 0.0.0.0 --port 8000
    environment: &env
      KAFKA_BOOTSTRAP: redpanda:9092
      # API uses the restricted role (row-level security applies)
      DATABASE_URL: postgresql://signal_api:signal_api@postgres:5432/signal
      WORKER_DATABASE_URL: postgresql://signal:signal@postgres:5432/signal
      # The data pack ends on 2026-10-18, so rank the week before 2026-10-19 by default.
      # Start with AS_OF= docker compose up ... to rank the week before "now" instead.
      AS_OF: ${AS_OF-2026-10-19}
    ports: ["8000:8000"]
    depends_on:
      redpanda-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}

  worker:
    build: .
    command: python -m signal_app.entrypoints.worker
    environment: *env
    depends_on:
      redpanda-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}

  # Recomputes the themes every 5 minutes (ADR 0007). Run only one.
  scheduler:
    build: .
    command: python -m signal_app.entrypoints.scheduler
    environment: *env
    depends_on:
      postgres: {condition: service_healthy}

  # Monitoring: Prometheus collects the numbers from api, worker and scheduler every 15 s and checks
  # the alert rules; Grafana draws them. Open http://localhost:3000 (dashboard "Signal overview").
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["9090:9090"]
    depends_on: [api, worker, scheduler]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Local demo only: anyone who opens the page can look, admin/admin can edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/signal-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  promdata:
